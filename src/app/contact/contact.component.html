<div class="main_div" id="contact">
    <div class="headline">
        <img class="purple_line" src="/assets/img/LINE3.png" alt="">
        <span>Contact</span>
    </div>
    <div class="form_main">
        <div infiniteScroll (scrolled)="onScroll()" class="got_problem_div">
            <div class="blue_line_div">
                <span class="sub_headline">Got a problem to solve?</span>
            </div>
            <div class="contact_description">
                <span>Write me an email or connect with me on LinkedIn. I am interested in hearing from you, knowing your ideas and contributing
                    to your projects with my work.</span>
                <div class="contact_me_div">
                    <span>Need a Frontend developer?</span>
                    <p>Contact me!</p>
                </div>
            </div>
        </div>
        <div infiniteScroll [infiniteScrollDistance]="2" (scrolled)="onScroll()" class="input_div contact_buttons">
            <a class="send_button contact_button" [href]="'mailto:' + contact.email">Write me an email</a>
            <a class="send_button contact_button" [href]="contact.linkedin" target="_blank" rel="noopener">Connect on LinkedIn</a>
            <span class="contact_email">{{ contact.email }}</span>
            <img (click)="scrollUp()" class="arrow_up" src="/assets/img/arrow_up.png" alt="">
        </div>
    </div>
</div>
